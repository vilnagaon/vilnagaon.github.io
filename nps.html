  .score-btn.selected{background:#2c2c2c;border-color:#2c2c2c;color:white}
  .score-labels{display:flex;justify-content:space-between;font-size:11px;color:#999;margin-bottom:24px;padding:0 4px}
  textarea{width:100%;min-height:90px;border:1.5px solid #e8e2d6;border-radius:8px;padding:12px 14px;font-family:inherit;font-size:14px;resize:vertical;line-height:1.5}
  textarea:focus{outline:none;border-color:#8b6914}
  input[type="email"]{width:100%;border:1.5px solid #e8e2d6;border-radius:8px;padding:12px 14px;font-family:inherit;font-size:14px;margin-top:12px}
  input[type="email"]:focus{outline:none;border-color:#8b6914}
  .field-label{font-size:13px;color:#666;margin-bottom:6px;margin-top:18px;font-weight:500}
  .opt{color:#aaa;font-weight:normal}
  .submit-btn{width:100%;background:#2c2c2c;color:white;border:none;padding:16px;border-radius:8px;font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:24px;font-family:Georgia,serif;transition:opacity 0.15s}
  .submit-btn:hover{opacity:0.85}
  .submit-btn:disabled{opacity:0.4;cursor:not-allowed}
  .meta{text-align:center;font-size:11px;color:#aaa;margin-top:24px;line-height:1.5}

  .thank-you{display:none;text-align:center;padding:20px 32px}
  .thank-you.active{display:block}
  .thank-you h2{font-family:Georgia,serif;font-size:24px;margin-bottom:12px;font-weight:normal}
  .thank-you p{color:#666;font-size:15px;line-height:1.6;margin-bottom:20px}
  .cta-link{display:inline-block;background:#fdf9f0;border:2px solid #c9a96e;color:#8b6914;padding:14px 28px;border-radius:8px;text-decoration:none;font-weight:600;letter-spacing:0.5px;font-family:Georgia,serif;margin-top:8px;transition:all 0.15s;cursor:pointer;font-size:16px}
  .cta-link:hover{background:#f5edc7}
  .cta-link.dark{background:#2c2c2c;border-color:#2c2c2c;color:white}
  .cta-link.dark:hover{background:#3c3c3c}
  .form-section{display:block;padding:0 32px}
  .form-section.hidden{display:none}

// Paramètres d'URL
const params = new URLSearchParams(window.location.search);
const store = (params.get("store") || "").toLowerCase();
const channel = (params.get("channel") || "manual").toLowerCase();
const sourceCampaign = params.get("source") || "";
const prefilledEmail = params.get("email") || "";
const dry = params.get("dry") === "1";  // aperçu : affiche la page de remerciement sans rien écrire dans Supabase

// Langue : ?lang= (posé par l'e-mail), sinon langue du navigateur, sinon FR
const lang = (() => {
  const p = (params.get("lang") || "").toLowerCase().slice(0, 2);
  if (I18N[p]) return p;
  const n = (navigator.language || "fr").slice(0, 2).toLowerCase();
  return I18N[n] ? n : "fr";
})();
const T = I18N[lang];
const $ = id => document.getElementById(id);
const knownStore = STORES.includes(store);

document.documentElement.lang = lang;
document.title = T.title;
$("h1").textContent = T.h1.replace("{where}", T.where[knownStore ? store : "def"]);
$("lead").innerHTML = T.lead;
$("score-q").textContent = T.scoreQ;
$("lab-low").textContent = T.low; $("lab-high").textContent = T.high;
$("optional").textContent = T.optional;
$("email").placeholder = T.emailPh;
$("submit-btn").textContent = T.submit;
$("meta").innerHTML = T.meta;
$("pr-h2").textContent = T.pr_h2; $("pr-p").innerHTML = T.pr_p;
$("google-review-link").textContent = T.pr_google; $("share-btn").textContent = T.pr_share; $("pr-close").textContent = T.pr_close;
$("pa-h2").textContent = T.pa_h2; $("pa-p").innerHTML = T.pa_p;
$("dt-h2").textContent = T.dt_h2;
document.querySelectorAll(".back-link").forEach(a => a.textContent = T.back);

if (prefilledEmail) $("email").value = prefilledEmail;

// Segment NPS selon le score
const band = s => s === null ? "none" : s >= 9 ? "promoter" : s >= 7 ? "passive" : "detractor";

// La question et le champ e-mail s'adaptent au score choisi
let selectedScore = null;
function refreshPrompts() {
  const b = band(selectedScore);
  $("comment-label").textContent = T["c_" + b];
  $("comment").placeholder = T["p_" + b];
  $("email-label").textContent = b === "detractor" ? T.emailLow : T.email;
}

const buttons = document.querySelectorAll(".score-btn");
const submitBtn = $("submit-btn");

const prefilledScore = params.get("score");
if (prefilledScore !== null && /^(10|[0-9])$/.test(prefilledScore)) {
  const btn = document.querySelector(`.score-btn[data-score="${prefilledScore}"]`);
  if (btn) {
    btn.classList.add("selected");
    selectedScore = parseInt(prefilledScore, 10);
    submitBtn.disabled = false;
  }
}
refreshPrompts();

buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedScore = parseInt(btn.dataset.score, 10);
    submitBtn.disabled = false;
    refreshPrompts();
  });
});

// Partage (pas encore de programme de parrainage : simple recommandation, sans code ni suivi)

  try {
    if (navigator.share) {
      await navigator.share({title: "Teatower", text: T.shareText, url: SHARE_URL});
    } else {
      await navigator.clipboard.writeText(T.shareText + " " + SHARE_URL);
      $("share-btn").textContent = T.copied;
    }
  } catch (e) { /* partage annulé : rien à faire */ }
});

function showThanks() {
  $("form-section").classList.add("hidden");
  const b = band(selectedScore);
  if (b === "promoter") {
    $("google-review-link").href = GOOGLE_REVIEW_URLS[store] || GOOGLE_REVIEW_URLS.waterloo;
  } else if (b === "detractor") {
    // On ne promet une réponse que si on a de quoi répondre
    const hasEmail = !!$("email").value.trim();
    $("dt-p").textContent = hasEmail ? T.dt_p_yes : T.dt_p_no;
    $("dt-contact").textContent = hasEmail ? T.dt_contact_yes : T.dt_contact_no;
  }
  $("thanks-" + b).classList.add("active");
}

// Envoi
submitBtn.addEventListener("click", async () => {
  if (selectedScore === null) return;
  submitBtn.disabled = true;
  submitBtn.textContent = T.sending;
  $("err").classList.remove("show");

  if (dry) { showThanks(); return; }

  const payload = {
    p_email: $("email").value.trim() || null,
    p_score: selectedScore,
    p_comment: $("comment").value.trim() || null,
    p_store: knownStore ? store : null,
    p_channel: ["pos","online","manual"].includes(channel) ? channel : "manual",
    p_source: sourceCampaign || null,
    p_user_agent: navigator.userAgent.substring(0, 200),
    p_referrer: document.referrer.substring(0, 200) || null,
  };

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_nps`, {
      method: "POST",
      headers: {
        "apikey": ANON_KEY,
        "Authorization": "Bearer " + ANON_KEY,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const errText = await res.text();
      console.error("NPS submit failed", res.status, errText);
      throw new Error("HTTP " + res.status);
    }
    showThanks();
  } catch (err) {
    submitBtn.disabled = false;
    submitBtn.textContent = T.submit;
    $("err").textContent = T.err;
    $("err").classList.add("show");
  }
});
</script>
</body>
</html>
