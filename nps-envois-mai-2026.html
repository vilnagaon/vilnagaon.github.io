<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NPS Envoyés par boutique — mai 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f5f0; color:#2c2c2c; padding:24px }
  .header { background:linear-gradient(135deg,#1a3a5c,#2c5f8a); color:white; padding:24px 28px; border-radius:14px; margin-bottom:20px }
  .header h1 { font-size:20px; font-weight:700 }
  .header p { font-size:13px; opacity:.75; margin-top:4px }
  .card { background:white; border-radius:12px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:16px }
  .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px }
  .kpi { background:white; border-radius:10px; padding:16px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08) }
  .kpi .val { font-size:28px; font-weight:700 }
  .kpi .lbl { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:.5px; margin-top:4px }
  .chart-wrap { position:relative; height:360px }
  .footer { text-align:center; color:#aaa; font-size:12px; margin-top:16px }
</style>
</head>
<body>

<div class="header">
  <h1>NPS — Envois par boutique par jour</h1>
  <p>1er mai → 26 mai 2026 &nbsp;·&nbsp; 16 jours d'envoi &nbsp;·&nbsp; Teatower</p>
</div>

<div class="kpi-row">
  <div class="kpi">
    <div class="val" style="color:#1a3a5c">1181</div>
    <div class="lbl">Total envoyés</div>
  </div>
  <div class="kpi">
    <div class="val" style="color:#2D5016">106</div>
    <div class="lbl">Waterloo</div>
  </div>
  <div class="kpi">
    <div class="val" style="color:#8B4513">594</div>
    <div class="lbl">Namur</div>
  </div>
  <div class="kpi">
    <div class="val" style="color:#1a5276">481</div>
    <div class="lbl">Liège</div>
  </div>
</div>

<div class="card">
  <div class="chart-wrap">
    <canvas id="npsChart"></canvas>
  </div>
</div>

<script>
const labels = ['1 May', '2 May', '3 May', '5 May', '6 May', '7 May', '8 May', '9 May', '12 May', '14 May', '15 May', '16 May', '19 May', '22 May', '23 May', '26 May'];
const datasets = [
  {
    label: 'Waterloo',
    data: [0, 16, 0, 6, 4, 7, 6, 10, 2, 10, 6, 10, 8, 12, 7, 2],
    backgroundColor: '#2D5016',
    borderRadius: 3,
    stack: 'nps',
  },
  {
    label: 'Namur',
    data: [0, 57, 10, 44, 31, 29, 42, 62, 23, 40, 40, 65, 30, 61, 43, 17],
    backgroundColor: '#8B4513',
    borderRadius: 3,
    stack: 'nps',
  },
  {
    label: 'Liège',
    data: [82, 39, 2, 25, 11, 18, 24, 72, 18, 21, 25, 31, 26, 42, 26, 19],
    backgroundColor: '#1a5276',
    borderRadius: 3,
    stack: 'nps',
  },
];

new Chart(document.getElementById('npsChart'), {
  type: 'bar',
  data: { labels, datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'top', labels: { font: { size: 13 }, padding: 20 } },
      tooltip: {
        callbacks: {
          footer: (items) => {
            const total = items.reduce((s,i) => s + i.parsed.y, 0);
            return 'Total : ' + total;
          }
        }
      }
    },
    scales: {
      x: {
        stacked: true,
        grid: { display: false },
        ticks: { font: { size: 12 } }
      },
      y: {
        stacked: true,
        beginAtZero: true,
        grid: { color: '#f0f0f0' },
        ticks: { font: { size: 12 } },
        title: { display: true, text: 'NPS envoyés', font: { size: 12 } }
      }
    }
  }
});
</script>

<div class="footer">Données : table nps_emails_sent · Supabase · Teatower 2026</div>
</body>
</html>
